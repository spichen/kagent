apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: hermes-harness
  namespace: kagent
spec:
  byo: {}
  workload:
    image: ghcr.io/spichen/hermes-kagent@sha256:00982619c3308789949d36f3dcf8b1bc00d8831da6835ed3f31e29387b57098d
    command: ["/opt/hermes/.venv/bin/python", "/opt/kagent-hermes/adapter.py"]
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: hermes-template
  namespace: kagent
spec:
  description: Hermes agent with local terminal and file tools.
  modelConfig:
    name: default-model-config
  systemPrompt: >-
    You are Hermes, a helpful assistant running in a kagent sandbox.
    Use /data/workspace for user files and work products.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: hermes-agent
  namespace: kagent
spec:
  harnessRef:
    name: hermes-harness
  template:
    ref:
      name: hermes-template
