name: publish-ghcr

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Validate matching Substrate integration
        run: |
          make -C go setup-envtest
          export KUBEBUILDER_ASSETS="$(make -s -C go envtest-path)"
          go test -C go -p 2 ./core/internal/substrate ./core/internal/translator ./core/internal/controller

      - name: Resolve version
        id: version
        run: |
          set -o errexit -o nounset -o pipefail
          sha="$(git rev-parse HEAD)"
          version="0.0.0-alpha.g${sha:0:12}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${sha} as ${version}"

  images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: build-controller
            image: controller
            var: CONTROLLER_IMG
          - target: build-ui
            image: ui
            var: UI_IMG
          - target: build-kagent-adk
            image: kagent-adk
            var: KAGENT_ADK_IMG
          - target: build-golang-adk
            image: golang-adk
            var: GOLANG_ADK_IMG
          - target: build-claude-harness
            image: claude-harness
            var: CLAUDE_HARNESS_IMG
          - target: build-codex-harness
            image: codex-harness
            var: CODEX_HARNESS_IMG
          - target: build-sandbox-guest
            image: sandbox-guest
            var: SANDBOX_GUEST_IMG
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: kagent-builder-v0.23.0
          driver: docker-container
          version: v0.23.0
          platforms: linux/amd64,linux/arm64
          use: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        env:
          CI: "true"
          VERSION: ${{ needs.prepare.outputs.version }}
          DOCKER_REGISTRY: ghcr.io
          DOCKER_BUILDER: docker buildx build
          DOCKER_BUILD_ARGS: --push --platform linux/amd64,linux/arm64
        run: |
          set -o errexit -o nounset -o pipefail
          make "${{ matrix.target }}" "${{ matrix.var }}=ghcr.io/spichen/kagent/${{ matrix.image }}:${VERSION}"

  charts:
    needs:
      - prepare
      - images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push charts
        env:
          CI: "true"
          VERSION: ${{ needs.prepare.outputs.version }}
          HELM_REPO: oci://ghcr.io/spichen
          HELM_EXPERIMENTAL_OCI: "1"
        run: |
          set -o errexit -o nounset -o pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
          # Published charts pull the images built above. Local kind builds keep
          # the kagent-dev repository path in git.
          perl -i -pe 's#kagent-dev/kagent/#spichen/kagent/#g' helm/kagent/values.yaml
          make helm-publish

  cli:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Build CLI binaries
        env:
          CI: "true"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: make build-cli

      - name: Upload CLI binaries
        uses: actions/upload-artifact@v4
        with:
          name: kagent-cli-${{ needs.prepare.outputs.version }}
          path: go/core/bin/kagent-*
          if-no-files-found: error

  hermes:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test Hermes
        env:
          IMAGE: ghcr.io/spichen/hermes-kagent:${{ needs.prepare.outputs.version }}
        run: |
          docker buildx build --platform linux/arm64 --load -t "$IMAGE" -f python/samples/hermes/Dockerfile python
          docker run --rm --platform linux/arm64 --entrypoint /opt/hermes/.venv/bin/python -v "$PWD/python/samples/hermes:/tests:ro" -w /tests "$IMAGE" -m unittest -v test_adapter
          docker run --rm --platform linux/arm64 --entrypoint /opt/hermes/.venv/bin/python -e OPENAI_API_KEY=smoke-placeholder -v "$PWD/python/samples/hermes:/tests:ro" -w /tests "$IMAGE" smoke_test.py
          docker push "$IMAGE"
